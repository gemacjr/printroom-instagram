name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - run: mvn -B test
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci && npm test && npm run typecheck && npm run lint && npm run build
        working-directory: frontend

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive && terraform init -backend=false && terraform validate
        working-directory: infra/terraform

  # Full-stack contract test: LocalStack + Redis + API + worker, then the Postman collection.
  e2e:
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build --wait localstack redis api worker
      - run: npx --yes newman run postman/Printroom.postman_collection.json -e postman/Local.postman_environment.json --working-dir postman --reporters cli,junit --reporter-junit-export newman.xml
      - if: failure()
        run: docker compose logs api worker localstack
